[project]
name = "mirror-eval"
version = "0.1.0"
description = "Evaluation harness for MIRROR Resolve (synthetic AP fixtures, no real money movement)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirror_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
