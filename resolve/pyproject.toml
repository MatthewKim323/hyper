[project]
name = "mirror-resolve"
version = "0.1.0"
description = "Autonomous AP exception-resolution worker (synthetic sandbox, no real money movement)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "openai>=1.50",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirror_resolve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
