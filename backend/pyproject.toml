[project]
name = "hyper-onboarding"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "websockets>=14,<16",
    "pydantic>=2.7,<3",
    "python-dotenv>=1,<2",
    "PyJWT[crypto]>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.35,<2",
    "python-multipart>=0.0.20,<1",
    "pypdf>=6,<7",
    "cryptography>=44,<47",
    "openpyxl>=3.1,<4",
    "mirror-resolve",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv.sources]
mirror-resolve = { path = "../resolve", editable = true }
