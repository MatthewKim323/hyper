# Local development only. Ports bind to loopback; use managed services/TLS for deployment.
name: hyper-data
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: hyper
      POSTGRES_USER: hyper
      POSTGRES_PASSWORD: hyper-local-only
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyper"]
      interval: 5s
      timeout: 5s
      retries: 20
  objects:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hyper-local
      MINIO_ROOT_PASSWORD: hyper-local-only-password
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: ["object-data:/data"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.8
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: trial
      xpack.ml.max_machine_memory_percent: 60
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports: ["127.0.0.1:19200:9200"]
    volumes: ["search-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
  object-data:
  search-data:
